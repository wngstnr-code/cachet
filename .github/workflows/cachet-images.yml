name: cachet-images

on:
  push:
    branches: [main]
    paths:
      - "services/engine/**"
      - "apps/server/**"
      - "packages/contracts-abi/**"
      - "tsconfig.base.json"
      - "scripts/deploy/build-ovh-images.sh"
      - "services/engine/Dockerfile"
      - "apps/server/Dockerfile"
      - ".github/workflows/cachet-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cachet-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify merged backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require a commit contained in main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "::error::image publication is restricted to commits contained in main"
            exit 1
          }
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/engine/requirements.txt
      - name: Test engine
        working-directory: services/engine
        run: |
          python -m pip install --requirement requirements.txt
          python -m pytest
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Test gateway
        working-directory: apps/server
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
      - name: Validate deployment config
        env:
          CACHET_RUNTIME_ENV: ${{ github.workspace }}/scripts/deploy/ovh.runtime.env.example
        run: |
          bash -n scripts/deploy/*.sh
          bash scripts/deploy/test-ci-deploy.sh
          docker compose \
            --env-file scripts/deploy/ovh.deploy.env.example \
            --file scripts/deploy/compose.ovh.yml \
            config --quiet

  publish:
    name: publish immutable amd64 images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to personal GHCR namespace
        env:
          GHCR_PUSH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN }}
        run: |
          test -n "${GHCR_PUSH_TOKEN}" || {
            echo "::error::GHCR_PUSH_TOKEN is not configured"
            exit 1
          }
          printf '%s' "${GHCR_PUSH_TOKEN}" \
            | docker login ghcr.io --username scientivan --password-stdin
      - name: Build and publish both images
        env:
          PUBLISH_IMAGES: "1"
          REGISTRY_NAMESPACE: ghcr.io/scientivan
        run: scripts/deploy/build-ovh-images.sh
      - name: Verify remote manifests
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/scientivan/cachet-engine:sha-${GITHUB_SHA}" >/dev/null
          docker buildx imagetools inspect \
            "ghcr.io/scientivan/cachet-gateway:sha-${GITHUB_SHA}" >/dev/null
      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io >/dev/null 2>&1 || true
